<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация Снайпера</title>
    <!-- Официальный скрипт Telegram Web Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        button {
            background-color: var(--tg-theme-button-color, #5288c1);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h2>Авторизация</h2>
    <p>Нажмите кнопку ниже, чтобы привязать аккаунт Telegram к боту.</p>
    
    <button id="authBtn">Подтвердить авторизацию</button>

    <script>
        // Инициализируем Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        document.getElementById('authBtn').addEventListener('click', () => {
            // tg.initData содержит ту самую длинную строку с query_id и hash
            let initData = tg.initData;
            
            if (initData) {
                // Закрываем окно и отправляем строку прямо в C# бота (как MessageType.WebAppData)
                tg.sendData(initData);
            } else {
                alert("Ошибка! Откройте приложение с телефона внутри Telegram.");
            }
        });
    </script>
</body>
</html>
