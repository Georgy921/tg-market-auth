<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); text-align: center; font-family: sans-serif; padding: 20px; }
        textarea { width: 100%; height: 120px; margin-top: 15px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; background: var(--tg-theme-secondary-bg-color, #eee); color: var(--tg-theme-text-color, #000); resize: none; word-break: break-all; }
        button { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); border: none; padding: 14px 20px; border-radius: 8px; font-size: 16px; margin-top: 15px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <h3>Ключ доступа</h3>
    <p>Нажмите кнопку ниже, чтобы скопировать ваш уникальный ключ, а затем отправьте его боту.</p>
    
    <textarea id="tokenData" readonly>Загрузка...</textarea>
    <button id="copyBtn" onclick="copyToken()">📋 Скопировать и закрыть</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const tokenBox = document.getElementById('tokenData');

        // В Inline-режиме initData всегда заполнена
        if (tg.initData) {
            tokenBox.value = tg.initData;
        } else {
            tokenBox.value = "Ошибка: Откройте приложение через Inline-кнопку бота.";
        }

        function copyToken() {
            tokenBox.select();
            document.execCommand('copy');
            tg.close(); // Автоматически закрываем Web App после копирования
        }
    </script>
</body>
</html>
