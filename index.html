<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация TG Market</title>
    <!-- Официальный скрипт Telegram Web Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            margin: 0;
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--tg-theme-button-color, #2481cc);
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="spinner" id="loader"></div>
    <h3 id="status">Авторизация...</h3>
    <p id="substatus">Передаем ключи доступа боту</p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        if (tg.initData && tg.initData.length > 0) {
            // Отправляем строку initData обратно в диалог с ботом
            tg.sendData(tg.initData);
        } else {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('status').innerText = 'Ошибка сессии';
            document.getElementById('substatus').innerText = 'Откройте приложение внутри клиента Telegram.';
        }
    </script>
</body>
</html>
